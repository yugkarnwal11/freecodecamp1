<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body style= "text-align:center;">
    <h1>Hotel Booking Form</h1>
    <form>
        <label for= "name">Full Name:</lebel>
        <input type="text" id="Name" placeholder="enter your name">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">Male
        <input type="radio" id="female" name="gender" value="female">Female
        <input type="radio" id="other" name="gender" value="other">Other
        <br><br>
        
<label for= "email">Email:</lebel>
     <input type="email" id="email" placeholder= "enter your email"> 
     <br><br>
     <label for="phone">Phone Number</label>
     <input type="tel" id="phone" placeholder= "enter your phone number">
<br><br>
<label for= "checkin">Check-in Date:</label>
<input type= "date" id="checkin">
<br><br>
<label for="room type">Room Type</label>
<select id="room type">
    <option value="">Chose From Type</option>
    <option value="value">Choose Room Type </option>
    <option value="single">Single</option>
    <option value="suite">Suite</option>
</select>
<br><br>
<label for="guest">No of Guest</label>
<input type="number" id="guest" min="1" max="10">
<br><br>
<label for="special request">Special Request:</label>
<br><br>
<textarea id="special request" row= "4" col= "50" placeholder="Enter any special request">
</textarea>
<br><br>
<input type="submit" value="book now">
<input type="reset" value="reset now">

    </form>
</body>
</html>
